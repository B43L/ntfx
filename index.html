<!DOCTYPE html>
<html lang="en">
<head>

                <div class="movies">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
                    <img src="images/list-images/stat2.jpg" alt="movie1">
